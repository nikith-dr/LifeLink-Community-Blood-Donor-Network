{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h2>Login</h2>

                <form method="post">
                    <div class="mb-3">
                        <label>Email</label>
                        <input
                            class="form-control"
                            type="email"
                            name="email"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label>Password</label>
                        <input
                            class="form-control"
                            type="password"
                            name="password"
                            required
                        >
                    </div>

                    <button class="btn btn-danger" type="submit">
                        Login
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
