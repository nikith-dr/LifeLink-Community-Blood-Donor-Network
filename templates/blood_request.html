{% extends "base.html" %}{% block title %}Blood Request{% endblock %}
{% block content %}<div class="row justify-content-center"><div class="col-lg-8"><div class="card"><div class="card-body"><h2>Create Blood Request</h2>
<form method="post" class="row g-3">
<div class="col-md-6"><label>Blood Group</label><select class="form-select" name="blood_group" required>{% for bg in blood_groups %}<option>{{ bg }}</option>{% endfor %}</select></div>
<div class="col-md-6"><label>Units</label><input class="form-control" type="number" name="units" min="1" value="1" required></div>
<div class="col-md-8"><label>Hospital</label><input class="form-control" name="hospital" required></div>
<div class="col-md-4"><label>City</label><input class="form-control" name="city" required></div>
<div class="col-md-6"><label>Urgency</label><select class="form-select" name="urgency"><option>Emergency</option><option>Urgent</option><option>Normal</option></select></div>
<div class="col-md-6"><label>Contact</label><input class="form-control" name="contact" required></div>
<div class="col-12"><label>Notes</label><textarea class="form-control" name="notes"></textarea></div>
<div class="col-12"><button class="btn btn-danger">Publish Request</button></div>
</form></div></div></div></div>{% endblock %}
