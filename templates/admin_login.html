{% extends "base.html" %}

{% block title %}Admin Login - LifeLink{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6 col-lg-5">

            <div class="card shadow">

                <div class="card-body p-4">

                    <div class="text-center mb-4">

                        <div style="font-size: 50px;">
                            🔐
                        </div>

                        <h2 class="fw-bold">
                            Admin Login
                        </h2>

                        <p class="text-muted">
                            LifeLink Administrator Access
                        </p>

                    </div>


                    <form method="post">

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Admin Email
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                placeholder="Enter admin email"
                                required
                            >

                        </div>


                        <div class="mb-4">

                            <label class="form-label fw-bold">
                                Admin Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="Enter admin password"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="btn btn-danger w-100 py-2 fw-bold"
                        >
                            🔐 Login as Admin
                        </button>

                    </form>


                    <div class="text-center mt-4">

                        <a
                            href="{{ url_for('login') }}"
                            class="text-decoration-none"
                        >
                            ← Back to User Login
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
